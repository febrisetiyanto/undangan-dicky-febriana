<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generator Link Undangan - Dicky & Febriana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --gold:#d4af6a;
      --gold-dark:#b78b42;
      --cream:#fdf8f3;
      --white:#ffffff;
      --text:#2c2015;
      --text-soft:#6d5d4a;
      --font-serif:'Cormorant Garamond', serif;
      --font-sans:'Raleway', sans-serif;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{
      font-family:var(--font-sans);
      background:var(--cream);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .gen-card{
      background:var(--white);
      border:1px solid var(--gold);
      border-radius:12px;
      max-width:460px;
      width:100%;
      padding:36px 28px;
      text-align:center;
      box-shadow:0 10px 30px rgba(180,140,60,0.12);
    }
    .gen-label{
      font-size:0.8rem;
      letter-spacing:2px;
      text-transform:uppercase;
      color:var(--gold-dark);
      margin-bottom:6px;
    }
    .gen-title{
      font-family:var(--font-serif);
      font-size:1.8rem;
      color:var(--text);
      margin-bottom:22px;
    }
    .gen-input{
      width:100%;
      padding:12px 14px;
      border:1.5px solid var(--gold);
      border-radius:8px;
      font-family:var(--font-sans);
      font-size:1rem;
      color:var(--text);
      background:var(--cream);
      margin-bottom:14px;
    }
    .gen-input:focus{
      outline:none;
      border-color:var(--gold-dark);
    }
    .gen-btn{
      width:100%;
      padding:13px;
      border:none;
      border-radius:8px;
      background:var(--gold);
      color:var(--white);
      font-family:var(--font-sans);
      font-weight:500;
      font-size:1rem;
      cursor:pointer;
      transition:background .2s;
    }
    .gen-btn:hover{ background:var(--gold-dark); }
    .gen-result{
      margin-top:24px;
      text-align:left;
      border-top:1px solid #eee;
      padding-top:20px;
    }
    .gen-result.hidden{ display:none; }
    .gen-result-label{
      font-size:0.78rem;
      color:var(--text-soft);
      margin-bottom:6px;
    }
    .gen-link-box{
      background:var(--cream);
      border:1px solid var(--gold);
      border-radius:8px;
      padding:10px 12px;
      font-size:0.85rem;
      word-break:break-all;
      color:var(--text);
      margin-bottom:12px;
    }
    .gen-actions{
      display:flex;
      gap:10px;
    }
    .gen-action-btn{
      flex:1;
      padding:11px;
      border-radius:8px;
      border:1.5px solid var(--gold);
      background:transparent;
      color:var(--gold-dark);
      font-family:var(--font-sans);
      font-size:0.9rem;
      font-weight:500;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:.2s;
    }
    .gen-action-btn.copied{
      background:var(--gold);
      color:var(--white);
      border-color:var(--gold);
    }
    .gen-action-btn.wa{
      background:var(--gold);
      color:var(--white);
    }
    .gen-note{
      margin-top:18px;
      font-size:0.78rem;
      color:var(--text-soft);
    }
  </style>
</head>
<body>

  <div class="gen-card">
    <p class="gen-label">Khusus Mempelai</p>
    <h1 class="gen-title">Generator Link Undangan</h1>

    <input type="text" id="gen-name" class="gen-input" placeholder="Nama Tamu (misal: Budi Santoso)" />
    <button class="gen-btn" onclick="generateLink()">Buat Link Personal</button>

    <div class="gen-result hidden" id="link-result">
      <p class="gen-result-label">Link Undangan:</p>
      <div class="gen-link-box" id="link-url"></div>
      <div class="gen-actions">
        <button class="gen-action-btn" onclick="copyLink(this)"><span>📋 Salin Link</span></button>
        <a href="#" id="wa-btn" target="_blank" class="gen-action-btn wa">💬 Kirim via WA</a>
      </div>
    </div>

    <p class="gen-note">Halaman ini hanya untuk Anda gunakan sendiri saat membagikan undangan ke tiap tamu — tidak perlu dikirim ke tamu.</p>
  </div>

  <script>
    // Ganti URL ini kalau alamat undangan Anda berbeda
    var INVITATION_URL = "https://undangan-dicky-febriana.vercel.app/";

    function generateLink() {
      var input = document.getElementById('gen-name');
      var name = input.value.trim();
      if (!name) { input.focus(); return; }

      var encoded = encodeURIComponent(name);
      var link = INVITATION_URL + '?to=' + encoded;

      document.getElementById('link-url').textContent = link;

      var msg = "Assalamu'alaikum, " + name + " 🌸\n\nBersama ini kami mengundang Anda untuk hadir di pernikahan kami 💍\n\nSilakan buka undangan digital kami di:\n" + link + "\n\nAtas kehadiran dan doa restunya, kami ucapkan terima kasih 🙏";
      var waUrl = 'https://wa.me/?text=' + encodeURIComponent(msg);
      document.getElementById('wa-btn').href = waUrl;

      var resultEl = document.getElementById('link-result');
      resultEl.classList.remove('hidden');
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function copyLink(btn) {
      var link = document.getElementById('link-url').textContent;
      navigator.clipboard.writeText(link).then(function() {
        var span = btn.querySelector('span');
        span.textContent = '✅ Tersalin!';
        btn.classList.add('copied');
        setTimeout(function() { span.textContent = '📋 Salin Link'; btn.classList.remove('copied'); }, 2000);
      });
    }

    document.getElementById('gen-name').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') generateLink();
    });
  </script>

</body>
</html>
